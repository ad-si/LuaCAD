[package]
name = "luacad-studio"
version.workspace = true
repository.workspace = true
# Higher than the workspace default: the egui stack requires 1.95 and the
# `luacad` dependency 1.96.
rust-version = "1.96"
edition = "2024"
description = "A 3D CAD studio with Lua scripting and live preview"
license = "AGPL-3.0-or-later"
readme = "README.md"
keywords = ["cad", "lua", "csg", "3d", "gui"]
categories = ["graphics"]

[features]
default = []
csgrs = ["dep:csgrs", "luacad/csgrs"]

[dependencies]
# `raytrace` is spelled out (it is also `luacad`'s default feature) because
# the viewport's Raytrace button depends on it unconditionally.
luacad = { workspace = true, features = ["raytrace"] }
clap = { workspace = true }
egui = "0.36"
# The `winit` feature brings the surface-managing `Painter`
egui-wgpu = { version = "0.36", features = ["winit"] }
egui_extras = { version = "0.36", features = ["default", "syntect"] }
# The version egui-wgpu 0.36 is built against
wgpu = "30"
# Image-based CSG for the live preview, on the same wgpu device as egui
webcsg = "0.1"
# WebCSG's matrix type; the camera keeps using cgmath
glam = "0.33"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
cgmath = "0.18"
csgrs = { version = "0.20", default-features = false, features = ["f32"], optional = true }
arboard = "3"
# Deflates the screenshot PDF's image and content streams
flate2 = "1"
rfd = "0.17"
winit = "0.30"
time = { version = "0.3", features = ["formatting", "local-offset"] }
dirs = "6"
serde_json = "1"
