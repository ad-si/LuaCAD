[package]
name = "luacad-studio"
version.workspace = true
repository.workspace = true
# Higher than the workspace default: the egui stack requires 1.95 and the
# `luacad` dependency 1.96.
rust-version = "1.96"
edition = "2024"
description = "A 3D CAD studio with Lua scripting and live preview"
license = "AGPL-3.0-or-later"
readme = "README.md"
keywords = ["cad", "lua", "csg", "3d", "gui"]
categories = ["graphics"]

[features]
default = []
csgrs = ["dep:csgrs", "luacad/csgrs"]

[dependencies]
# `raytrace` is spelled out (it is also a default feature) because the
# viewport's Raytrace button depends on it unconditionally.
luacad = { version = "1.1.0", path = "../luacad", features = ["raytrace"] }
clap = { version = "4", features = ["derive"] }
egui = "0.36"
egui_glow = "0.36"
egui_extras = { version = "0.36", features = ["default", "syntect"] }
cgmath = "0.18"
csgrs = { version = "0.20", default-features = false, features = ["f32"], optional = true }
opencsg-sys = { version = "1.1.0", path = "../opencsg-sys" }
arboard = "3"
rfd = "0.17"
winit = "0.30"
glutin = "0.32"
glow = "0.17"
raw-window-handle = "0.6"
time = { version = "0.3", features = ["formatting", "local-offset"] }
dirs = "6"
serde_json = "1"
