[package]
name = "luacad-studio"
version = "0.1.0"
edition = "2024"
description = "A 3D CAD studio with Lua scripting and live preview"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ad-si/LuaCAD"

[features]
default = []
csgrs = ["dep:csgrs", "luacad/csgrs"]

[dependencies]
luacad = { version = "0.1.0", path = "../luacad" }
egui = "0.36"
egui_glow = "0.36"
egui_extras = { version = "0.36", features = ["default", "syntect"] }
cgmath = "0.18"
csgrs = { version = "0.20", default-features = false, features = ["f32"], optional = true }
opencsg-sys = { version = "0.1.0", path = "../opencsg-sys" }
arboard = "3"
rfd = "0.17"
winit = "0.30"
glutin = "0.32"
glow = "0.17"
raw-window-handle = "0.6"
time = { version = "0.3", features = ["formatting", "local-offset"] }
dirs = "6"
serde_json = "1"
