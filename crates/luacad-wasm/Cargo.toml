[package]
name = "luacad-wasm"
version.workspace = true
repository.workspace = true
# Higher than the workspace default: `luacad` requires 1.96, and cargo checks
# that regardless of which of its features are enabled.
rust-version = "1.96"
edition = "2024"
description = "WebAssembly build of the LuaCAD engine, powering the web playground"
license = "AGPL-3.0-or-later"
# The artifact is a wasm module served by the website, not a crate anyone
# depends on.
publish = false

[[bin]]
name = "luacad-wasm"
path = "src/main.rs"

[dependencies]
# No feature is named, and the workspace dependency turns the default ones
# off: that drops `raytrace`, whose rand/getrandom dependency does not build
# on wasm32-unknown-unknown.
luacad = { workspace = true }
