name: Deploy LuaCAD Website

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten

      # Pinned rather than tracking `latest`: the emsdk decides how the wasm
      # is linked, and the site should not change underneath a commit that
      # only touched prose.
      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.6
          actions-cache-folder: emsdk-cache

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-emscripten

      # Builds the playground's engine into ./website/playground and checks
      # that it still runs a script, so a broken module is never published.
      - name: Build the playground engine
        run: make test-wasm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './website'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
