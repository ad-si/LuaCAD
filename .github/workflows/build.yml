name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-rust:
    runs-on: ubuntu-latest
    name: Lint Rust
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libwayland-dev

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- --deny warnings

  # The MSRV each crate advertises has to actually build, otherwise the
  # `rust-version` field just produces a more confusing error than none.
  msrv:
    runs-on: ubuntu-latest
    name: Check MSRV
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libwayland-dev

      # `luacad` and the two -sys crates share the workspace MSRV; Studio
      # needs a newer one because of the egui stack.
      - name: Install the luacad MSRV toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Install the luacad-studio MSRV toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check luacad, luacad-manifold-sys and opencsg-sys at 1.89
        run: |
          cargo +1.89.0 check \
            --package luacad \
            --package luacad-manifold-sys \
            --package opencsg-sys \
            --all-targets

      - name: Check luacad-studio at 1.95
        run: cargo +1.95.0 check --package luacad-studio --all-targets

  # Publishing is four irreversible pushes to crates.io in dependency order, so
  # a defective tarball has to surface here rather than halfway through.
  package:
    runs-on: ubuntu-latest
    name: Package
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libwayland-dev

      - name: Build and verify every crate tarball
        run: cargo package --workspace

  lint-lua:
    runs-on: ubuntu-latest
    name: Lint Lua
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libwayland-dev

      - name: Lint Lua examples
        run: cargo run --package luacad -- lint examples/

  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libwayland-dev

      - name: Test
        run: cargo test

  # Runs on macOS because the csgrs mesh snapshots are platform-dependent:
  # boolean ops diverge structurally across libm implementations, and the
  # snapshots are recorded on macOS.
  test-csgrs:
    runs-on: macos-latest
    name: Test csgrs feature
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Test with csgrs feature
        run: cargo test --package luacad --features csgrs

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.target }})

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libwayland-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload luacad binary
        uses: actions/upload-artifact@v7
        with:
          name: luacad-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/luacad
            target/${{ matrix.target }}/release/luacad.exe

      - name: Upload luacad-studio binary
        uses: actions/upload-artifact@v7
        with:
          name: luacad-studio-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/luacad-studio
            target/${{ matrix.target }}/release/luacad-studio.exe
