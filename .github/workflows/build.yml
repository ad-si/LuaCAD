name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-rust:
    runs-on: ubuntu-latest
    name: Lint Rust
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libwayland-dev

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- --deny warnings

  # The MSRV each crate advertises has to actually build, otherwise the
  # `rust-version` field just produces a more confusing error than none.
  msrv:
    runs-on: ubuntu-latest
    name: Check MSRV
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libwayland-dev

      # `luacad` and the two -sys crates share the workspace MSRV; Studio
      # needs a newer one because of the egui stack.
      - name: Install the luacad MSRV toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Install the luacad-studio MSRV toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check luacad, luacad-manifold-sys and opencsg-sys at 1.89
        run: |
          cargo +1.89.0 check \
            --package luacad \
            --package luacad-manifold-sys \
            --package opencsg-sys \
            --all-targets

      - name: Check luacad-studio at 1.95
        run: cargo +1.95.0 check --package luacad-studio --all-targets

  # Publishing is a series of irreversible pushes to crates.io in dependency
  # order, so a defective tarball has to surface here rather than halfway
  # through. `make release` lists the order.
  package:
    runs-on: ubuntu-latest
    name: Package
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libwayland-dev

      - name: Build and verify every crate tarball
        run: cargo package --workspace

  lint-lua:
    runs-on: ubuntu-latest
    name: Lint Lua
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libwayland-dev

      - name: Lint Lua examples
        run: cargo run --package luacad -- lint examples/

  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libwayland-dev

      # text() and the BOSL2 text shapes outline a system font, and the runner
      # image ships none. Without this the tests that assert on glyph geometry
      # skip themselves and the text path goes untested.
      - name: Install a font for the text tests
        run: sudo apt-get install -y fonts-dejavu-core

      - name: Test
        run: cargo test

  # Runs on macOS because the csgrs mesh snapshots are platform-dependent:
  # boolean ops diverge structurally across libm implementations, and the
  # snapshots are recorded on macOS.
  test-csgrs:
    runs-on: macos-latest
    name: Test csgrs feature
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Test with csgrs feature
        run: cargo test --package luacad --features csgrs

  # The same build the website deploy runs, so a change that breaks the
  # browser engine fails on the pull request instead of on `main`.
  wasm:
    runs-on: ubuntu-latest
    name: Build wasm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten

      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.6
          actions-cache-folder: emsdk-cache

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-emscripten

      - name: Build and smoke-test the wasm module
        run: make test-wasm

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.target }})

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libwayland-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload luacad binary
        uses: actions/upload-artifact@v7
        with:
          name: luacad-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/luacad
            target/${{ matrix.target }}/release/luacad.exe

      - name: Upload luacad-studio binary
        uses: actions/upload-artifact@v7
        with:
          name: luacad-studio-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/luacad-studio
            target/${{ matrix.target }}/release/luacad-studio.exe

  # Packs the binaries of a `v*` tag into one archive per target and attaches
  # them to the tag's release. Waits for the test job as well, so a tag that
  # builds but does not work never gets assets.
  release:
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    name: Attach release assets
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          mkdir -p dist stage

          # The targets come from the artifact names rather than a second copy
          # of the build matrix, so adding a platform there is enough.
          for path in artifacts/luacad-studio-*; do
            target="${path#artifacts/luacad-studio-}"
            dir="luacad-$version-$target"
            mkdir -p "stage/$dir"
            # `find` rather than a glob: the binary sits at the artifact root
            # today, but a nested path would copy nothing and go unnoticed.
            find "artifacts/luacad-$target" "artifacts/luacad-studio-$target" \
              -type f -exec cp {} "stage/$dir/" \;
            count=$(find "stage/$dir" -type f | wc -l)
            if [ "$count" -ne 2 ]; then
              echo "Expected 2 binaries for $target, found $count"
              exit 1
            fi
            # `upload-artifact` drops the executable bit.
            chmod +x "stage/$dir"/*
            if [[ "$target" == *windows* ]]; then
              (cd stage && zip -q -r "../dist/$dir.zip" "$dir")
            else
              tar -C stage -czf "dist/$dir.tar.gz" "$dir"
            fi
          done

          cd dist && sha256sum luacad-*.tar.gz luacad-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A tag pushed on its own has no release yet; leave that one as a
          # draft to be written up and published by hand.
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" \
              --draft \
              --title "LuaCAD ${TAG#v}" \
              --generate-notes
          fi

          gh release upload "$TAG" dist/* --clobber
