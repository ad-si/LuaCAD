[workspace]
members = ["crates/luacad", "crates/luacad-studio", "crates/opencsg-sys", "crates/manifold-sys"]
resolver = "3"

[workspace.package]
version = "1.0.0"
repository = "https://github.com/ad-si/LuaCAD"
# Edition 2024 needs 1.85; the dependency tree pushes it to 1.89.
# `luacad-studio` overrides this — the egui stack needs 1.95.
rust-version = "1.89"
